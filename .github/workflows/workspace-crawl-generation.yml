name: Generate Workspace crawl source companions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/workspace-crawl-generation.yml

permissions:
  contents: read

jobs:
  generate-companions:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/workspace-crawl-publication'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOOM_ENV_FILE: ""
      LOOM_CLICKHOUSE_IMAGE: clickhouse/clickhouse-server:26.10.4.207
      LOOM_CH_CONTAINER: loom-c2-generation
      LOOM_CH_HOST: localhost
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
      C2_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify requested source head
        run: test "$(git rev-parse HEAD)" = "$C2_EVENT_HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.19"
      - name: Install locked generator dependencies
        run: |
          uv sync --locked --extra dev --extra code --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Start fresh schema store
        id: clickhouse
        run: bash dev/ci_start_clickhouse.sh
      - name: Apply all migrations
        run: python -m server.core.schema.migrate
      - name: Verify migration replay
        run: python -m server.core.schema.migrate --dry-run --strict
      - name: Generate canonical schema
        run: make schema-dump
      - name: Generate canonical source companions
        run: |
          python -m scripts.codegen.sdk_py_gen
          python -m scripts.codegen.sdk_py_client_gen
          python -m scripts.codegen.sdk_ts_gen
          python -m scripts.codegen.docs_reference
          python -m scripts.codegen.op_reach_census --write-manifest
          python -m tests.analyzer.corpus --write
      - name: Check generated operation companions
        run: |
          python -m scripts.codegen.sdk_py_gen --check
          python -m scripts.codegen.sdk_py_client_gen --check
          python -m scripts.codegen.sdk_ts_gen --check
          python -m scripts.codegen.docs_reference --check
          python -m scripts.codegen.op_reach_census --check
      - name: Stage only public generated source with provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          head = git("rev-parse", "HEAD")
          assert head == os.environ["C2_EVENT_HEAD"], "source head changed"
          fixed = {
              "schemas/schema.sql",
              "sdk/python/loom/ops.py",
              "sdk/python/loom/client.py",
              "sdk/typescript/src/generated/ops.ts",
              "server/operations/reach_manifest.py",
              "tests/analyzer/shapes.txt",
              "llms.txt",
          }
          changed = subprocess.check_output(["git", "diff", "--name-only", "-z"]).split(b"\0")
          new = subprocess.check_output([
              "git", "ls-files", "--others", "--exclude-standard", "-z"
          ]).split(b"\0")
          paths = sorted({p.decode() for p in changed + new if p})
          assert "schemas/schema.sql" in paths, "migration schema output unchanged"
          output = Path(os.environ["RUNNER_TEMP"]) / "c2-public-generated"
          assert not output.exists(), "artifact staging already exists"
          files = {}
          for name in paths:
              path = Path(name)
              reference = path.is_relative_to("docs/reference") and path.suffix == ".md"
              assert name in fixed or reference, "unexpected generator output: " + name
              assert path.is_file() and not path.is_symlink(), "non-file generator output"
              raw = path.read_bytes()
              destination = output / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              files[name] = {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)}
          manifest = {
              "head": head,
              "tree_before_generation": git("rev-parse", "HEAD^{tree}"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "schema_image": os.environ["LOOM_CLICKHOUSE_IMAGE"],
              "migration_replay": "strict dry-run passed",
              "generation": "canonical schema and six source generators completed",
              "files": files,
          }
          (output / "generation-provenance.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload generated public source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c2-generated-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/c2-public-generated/
          if-no-files-found: error
          retention-days: 1
      - name: Stop schema store
        if: always()
        run: |
          if docker container inspect loom-c2-generation >/dev/null 2>&1; then
            docker rm -f loom-c2-generation
          fi
