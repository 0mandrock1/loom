name: INSTRUMENTED_DIAGNOSIS_ONLY SQL scaling

on:
  pull_request:
    types: [opened, synchronize]
    paths: [.github/workflows/sql-scaling-diagnosis.yml]

permissions:
  contents: read

concurrency:
  group: sql-diagnosis-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: INSTRUMENTED_DIAGNOSIS_ONLY
    if: github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    continue-on-error: true
    env:
      SQL_DIAG_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      LOOM_ENV_FILE: ""
      LOOM_BASE_URL: ""
      LOOM_CH_HOST: ""
      LOOM_TEST_SHARD: 1/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Freeze unchanged inputs at the event head
        id: freeze
        env:
          SQL_DIAG_DIR: ${{ runner.temp }}/sql-scaling-diagnosis
        shell: bash
        run: |
          python3 - <<'PY_FREEZE'
          import json
          import os
          import subprocess
          from pathlib import Path


          def git(*args):
              return subprocess.run(["git", *args], text=True, capture_output=True, check=True).stdout.strip()


          head = git("rev-parse", "HEAD")
          assert head == os.environ["SQL_DIAG_EVENT_HEAD"], (head, "event head mismatch")
          workflow = ".github/workflows/sql-scaling-diagnosis.yml"
          assert git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD").splitlines() == [workflow]
          assert (
              subprocess.run(["git", "cat-file", "-e", f"HEAD^:{workflow}"], capture_output=True).returncode
              != 0
          )
          expected = {
              "tests/unit/test_document_extraction.py": "879b5796a167aeb259bd3303edefdd06379c6427",
              "tests/unit/code_fixtures.py": "f52fc16efab41f28eefae3b7a719eca37704cfe1",
              "tests/unit/conftest.py": "fd8c12283ca7e32f4980e29d77b3e5b8f65ecc3f",
              "tests/unit/ch_fake.py": "ebdbe7377984ebd48ca43b36151858062a0ce405",
              "tests/conftest.py": "db0a6aff33092711061016b41d5dce0fa7a92484",
              "conftest.py": None,
              "extractor": "1464500564b92c1210689955ac68dac63039382e",
              "extractor/loom_extractor/sql.py": "b60d5a2a2e4bbda00522b8c6537772c4f03ef88b",
              "extractor/loom_extractor/artifact.py": "af3918278572e7f6916e7723a5cf8aa49a77dc2f",
              "extractor/loom_extractor/__init__.py": "08a9296932b1e76f5942239decf2e0ea78830b62",
              "extractor/pyproject.toml": "56c2d416789224624741b677b27081b8bcbc2f47",
              "pyproject.toml": "ae73aaf23361d6237631fdd7c84bde06872df0aa",
              "uv.lock": "58ac70f00da1f326d7aad82885623fb7724abd80",
              "sdk/python/pyproject.toml": "eafbda22d2b67039c683d362c874ddb003a9a131",
              ".coveragerc": None,
              ".github/workflows/ci.yml": "28599ebfd937e872403fa93dcf5612bbf65fbe5f",
          }
          actual = {}
          for path, wanted in expected.items():
              result = subprocess.run(
                  ["git", "rev-parse", "--verify", f"HEAD:{path}"], text=True, capture_output=True
              )
              actual[path] = result.stdout.strip() if result.returncode == 0 else None
              assert actual[path] == wanted, (path, wanted, actual[path])
          directory = Path(os.environ["SQL_DIAG_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "frozen-source.json").write_text(
              json.dumps(dict(head=head, expected=expected, actual=actual), indent=2) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("active=true\n")
          PY_FREEZE
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.freeze.outputs.active == 'true'
        with:
          python-version: 3.12.16
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        if: steps.freeze.outputs.active == 'true'
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install locked dependencies
        if: steps.freeze.outputs.active == 'true'
        shell: bash
        run: uv sync --locked --python "$(command -v python)" --extra dev --extra code
      - name: Observe the unchanged node once
        if: steps.freeze.outputs.active == 'true'
        env:
          SQL_DIAG_DIR: ${{ runner.temp }}/sql-scaling-diagnosis
          COVERAGE_FILE: ${{ runner.temp }}/sql-scaling-diagnosis/.coverage
        shell: bash
        run: |
          cat > "$SQL_DIAG_DIR/sql_scaling_observer.py" <<'PY_OBSERVER'
          """INSTRUMENTED_DIAGNOSIS_ONLY: whole calls, never a qualification result."""

          from __future__ import annotations

          import json
          import os
          import platform
          import resource
          import sys
          import time
          from pathlib import Path

          import pytest

          TARGET = (
              "tests/unit/test_document_extraction.py::"
              "test_one_line_sql_with_a_comment_after_every_semicolon_splits_in_linear_time"
          )


          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_call(item):
              if item.nodeid != TARGET:
                  yield
                  return

              import sqlglot

              from loom_extractor import sql

              events = []
              span_id = 0
              backend = {}

              def observe(kind, original, text_index):
                  def wrapped(*args, **kwargs):
                      nonlocal span_id
                      if kind == "_spans":
                          span_id += 1
                      call_id = span_id
                      text = args[text_index]
                      before = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
                      result = None
                      returned = False
                      start = time.process_time()
                      try:
                          result = original(*args, **kwargs)
                          returned = True
                          return result
                      finally:
                          elapsed = time.process_time() - start
                          if kind == "Dialect.tokenize" and not backend:
                              core = sys.modules.get("sqlglot.tokenizer_core")
                              tokens = sys.modules.get("sqlglot.tokens")
                              tokenizer = args[0].tokenizer_class
                              core_class = getattr(tokens, "TokenizerCore", None)
                              backend.update(
                                  dialect=f"{type(args[0]).__module__}.{type(args[0]).__qualname__}",
                                  tokenizer=f"{tokenizer.__module__}.{tokenizer.__qualname__}",
                                  core_file=getattr(core, "__file__", None),
                                  core_class=(
                                      f"{core_class.__module__}.{core_class.__qualname__}"
                                      if core_class is not None
                                      else None
                                  ),
                                  compiled=getattr(tokens, "SQLGLOTC_INSTALLED", None),
                              )
                          after = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
                          events.append(
                              dict(
                                  whole_call=kind,
                                  span_call_id=call_id,
                                  input_chars=len(text),
                                  process_cpu_s=elapsed,
                                  result_count=len(result) if returned else None,
                                  returned=returned,
                                  peak_rss_kib_before=before,
                                  peak_rss_kib_after=after,
                              )
                          )

                  return wrapped

              patch = pytest.MonkeyPatch()
              patch.setattr(sql, "_spans", observe("_spans", sql._spans, 0))
              patch.setattr(
                  sqlglot.Dialect, "tokenize", observe("Dialect.tokenize", sqlglot.Dialect.tokenize, 1)
              )
              outcome = None
              try:
                  outcome = yield
              finally:
                  patch.undo()
                  shape = {
                      kind: [e["input_chars"] for e in events if e["whole_call"] == kind]
                      for kind in ("_spans", "Dialect.tokenize")
                  }
                  report = dict(
                      classification="INSTRUMENTED_DIAGNOSIS_ONLY",
                      qualification=False,
                      node=item.nodeid,
                      event_head=os.environ["SQL_DIAG_EVENT_HEAD"],
                      python=sys.version,
                      platform=platform.platform(),
                      worker=os.environ.get("PYTEST_XDIST_WORKER"),
                      pid=os.getpid(),
                      sqlglot_version=sqlglot.__version__,
                      backend=backend,
                      process_clock=time.get_clock_info("process_time").implementation,
                      call_exception=outcome.excinfo[0].__name__ if outcome and outcome.excinfo else None,
                      events=events,
                      observed_shape=shape,
                      original_shape_matches=all(v == [9, 170_000, 2_720_000] for v in shape.values()),
                      limit=(
                          "_spans CPU includes tokenizer-observer overhead; "
                          "residual is not pure emission CPU. "
                          "RSS is process peak, not a per-stage live allocation count. "
                          "No result qualifies core CI."
                      ),
                  )
                  directory = Path(os.environ["SQL_DIAG_DIR"])
                  directory.mkdir(parents=True, exist_ok=True)
                  (directory / f"instrumented-{os.getpid()}.json").write_text(
                      json.dumps(report, indent=2) + "\n"
                  )
          PY_OBSERVER
          export PYTHONPATH="$SQL_DIAG_DIR${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          timeout --signal=TERM --kill-after=5s 115s .venv/bin/python -m pytest \
            tests/unit/test_document_extraction.py::test_one_line_sql_with_a_comment_after_every_semicolon_splits_in_linear_time \
            -vv -n 1 -p randomly --randomly-seed=443981909091 --durations=15 \
            -o faulthandler_timeout=300 --cov=server --cov=sdk/python/loom \
            --cov-branch --cov-report= --junitxml="$SQL_DIAG_DIR/junit.xml" \
            -p sql_scaling_observer 2>&1 | tee "$SQL_DIAG_DIR/pytest.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$SQL_DIAG_DIR/pytest-exit.txt"
          git diff --exit-code
          exit "$status"
      - name: Retain diagnostic evidence
        if: always() && steps.freeze.outputs.active == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: INSTRUMENTED_DIAGNOSIS_ONLY-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/sql-scaling-diagnosis/*.json
            ${{ runner.temp }}/sql-scaling-diagnosis/*.xml
            ${{ runner.temp }}/sql-scaling-diagnosis/*.log
            ${{ runner.temp }}/sql-scaling-diagnosis/*.txt
            ${{ runner.temp }}/sql-scaling-diagnosis/*.py
          retention-days: 3
          if-no-files-found: error
      - name: State the diagnostic limit
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          INSTRUMENTED_DIAGNOSIS_ONLY. Probe overhead changes the CPU judge.
          No outcome qualifies the node or erases an earlier failure.
          All existing core CI jobs and assertions remain mandatory.
          TEXT
