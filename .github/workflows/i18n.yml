name: translations

# Keeps i18n/<lang>/ in step with the English pages it translates. On a push to main that
# changes the README or a page under docs/, and on a manual run, it translates the stale
# pages with scripts/i18n/translate.py and opens or updates one pull request from the
# branch i18n/update. After a change to the prompt, a banner or the model, run it by hand
# with "all" to translate every page again. A pull request opened with the workflow token
# starts no other workflow: close and reopen it to run CI. Needs "Allow GitHub Actions to
# create and approve pull requests" (Settings → Actions → General).
#
# Claude is called on Amazon Bedrock with no stored secret: the job, in the environment
# i18n, exchanges its GitHub OIDC token for one-hour AWS credentials of the role in the
# repository variable LOOM_I18N_AWS_ROLE_ARN, in the region in LOOM_I18N_AWS_REGION. The
# credentials reach only the Translate step. While LOOM_I18N_AWS_ROLE_ARN is empty the job
# translates nothing and succeeds. The role's trust and permission policies are in
# CONTRIBUTING.md#translations.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      all:
        description: Translate every page, stale or not
        type: boolean
        default: false
      languages:
        description: Language codes to translate, separated by spaces (empty for all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The AWS role trusts this environment only, so no other job can assume it.
    environment: i18n
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      ROLE_ARN: ${{ vars.LOOM_I18N_AWS_ROLE_ARN }}
    defaults:
      run:
        # Explicit bash runs with -o pipefail, so a failed translation fails its step.
        shell: bash
    steps:
      - name: Skip without an AWS role
        if: env.ROLE_ARN == ''
        run: |
          echo "translations are off: no AWS role configured" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ROLE_ARN != ''
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.ROLE_ARN != ''
        with:
          python-version: "3.12"
      - name: Find stale translations
        id: check
        if: env.ROLE_ARN != ''
        env:
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" != "true" ] && python -m scripts.i18n.translate check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get AWS credentials
        id: aws
        if: steps.check.outputs.stale == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ vars.LOOM_I18N_AWS_REGION }}
          # Handed to the Translate step only, not exported to every later step.
          output-credentials: true
          output-env-credentials: false
      - name: Translate
        id: translate
        if: steps.check.outputs.stale == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.LOOM_I18N_AWS_REGION }}
          LOOM_I18N_MAX_USD: "5"
          ALL: ${{ inputs.all && '--all' || '' }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          args=($ALL)
          for code in $LANGUAGES; do args+=(--lang "$code"); done
          if python -m scripts.i18n.translate update "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          # The pages written passed the verifier; links, anchors and labels across i18n/
          # must hold before anything is pushed.
          python -m scripts.i18n.translate check --skip-stale
      - name: Open or update the pull request
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C i18n/update
          git add README.md i18n
          if git diff --cached --quiet; then
            echo "no page was translated"
            exit 0
          fi
          git commit -s -q -m "Translations follow ${SOURCE_SHA::9}"
          git push --force origin i18n/update
          title="Translations follow ${SOURCE_SHA::9}"
          body="Machine translations of the pages changed up to ${SOURCE_SHA}, generated by \`scripts/i18n/translate.py\`. Close and reopen this pull request to run CI."
          if [ -z "$(gh pr list --head i18n/update --state open --json number --jq '.[].number')" ]; then
            gh pr create --head i18n/update --base main --title "$title" --body "$body"
          else
            gh pr edit i18n/update --title "$title" --body "$body"
          fi
      - name: Fail when a page was not translated
        if: steps.translate.outputs.ok == 'false'
        run: |
          echo "some pages failed; the pull request carries the ones that passed"
          exit 1
