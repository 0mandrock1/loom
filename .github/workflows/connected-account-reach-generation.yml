name: Generate connected account reach companion

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/connected-account-reach-generation.yml
      - frontend/src/api/connections.ts
      - server/operations/dashboard.py
      - server/operations/reach_manifest.py

permissions:
  contents: read

jobs:
  generate-reach:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/connected-accounts-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOOM_ENV_FILE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install locked generator dependencies
        run: uv sync --locked --extra dev --extra code
      - name: Generate canonical reach manifest
        run: |
          source .venv/bin/activate
          python scripts/codegen/op_reach_census.py --write-manifest
      - name: Emit generated source with head and hash
        run: |
          printf '%s\n' 'LOOM_REACH_MANIFEST_HEAD_START'
          git rev-parse HEAD
          printf '%s\n' 'LOOM_REACH_MANIFEST_HEAD_END'
          printf '%s\n' 'LOOM_REACH_MANIFEST_SHA256_START'
          sha256sum server/operations/reach_manifest.py
          printf '%s\n' 'LOOM_REACH_MANIFEST_SHA256_END'
          printf '%s\n' 'LOOM_REACH_MANIFEST_BASE64_START'
          base64 --wrap=76 server/operations/reach_manifest.py
          printf '%s\n' 'LOOM_REACH_MANIFEST_BASE64_END'
